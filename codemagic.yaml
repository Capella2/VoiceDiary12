workflows:
  android-workflow:
    name: Android Release APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Build Android APK
        script: |
          # 1. Принимаем лицензии Android SDK
          yes | sdkmanager --licenses || true
          
          # 2. Генерируем папку android (Managed -> Bare)
          npx expo prebuild --platform android --no-interactive
          
          # 3. Переходим в папку и собираем релизный APK
          cd android
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
    publishing:
      email:
        recipients:
          - capella2@ukr.net # Замените на свой e-mail, чтобы получить файл