workflows:
  android-workflow:
    name: Android Release APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Build Android APK
        script: |
          # 1. Генерируем папку android самым простым способом
          # Если команда спросит про установку @expo/prebuild-config, npx сделает это сам
          npx expo prebuild --platform android --no-interactive
          
          # 2. Проверяем, создалась ли папка, и собираем
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleRelease
          else
            echo "Ошибка: Папка android не была создана!"
            exit 1
          fi
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
    publishing:
      email:
        recipients:
          - capella2@ukr.net