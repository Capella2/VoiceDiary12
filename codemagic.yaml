workflows:
  android-workflow:
    name: Android Release APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
    scripts:
      - name: Install dependencies
        script: |
          # 1. Фиксируем версию типов React, чтобы избежать конфликта ERESOLVE
          npm install @types/react@~18.2.0 --save-exact --legacy-peer-deps
          
          # 2. Устанавливаем остальные зависимости
          npm install --legacy-peer-deps
          
          # 3. Проверяем соответствие версий Expo
          npx expo install --check
      - name: Build Android APK
        script: |
          # 1. Создаем пустые папки для ассетов, если их нет, чтобы prebuild не падал
          mkdir -p assets/images
          
          # 2. Генерируем нативный проект android
          npx expo prebuild --platform android --no-interactive
          
          # 3. Собираем APK
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew clean
            ./gradlew assembleRelease
          else
            echo "Ошибка: Папка android не была создана!"
            exit 1
          fi
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
    publishing:
      email:
        recipients:
          - YOUR_EMAIL@EXAMPLE.COM # Замените на вашу почту