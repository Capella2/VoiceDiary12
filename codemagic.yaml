workflows:
  android-workflow:
    name: Android Release APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
    scripts:
      - name: Install dependencies
        script: |
          # Принудительно устанавливаем версии, которые требует Expo 55
          npm install react@19.2.0 react-dom@19.2.0 @types/react@~19.2.0 --save-exact --legacy-peer-deps
          
          # Устанавливаем всё остальное, игнорируя конфликты типов
          npm install --legacy-peer-deps
      - name: Build Android APK
        script: |
          # Создаем структуру папок, чтобы prebuild не падал
          mkdir -p assets/images
          
          # Генерируем android-проект
          npx expo prebuild --platform android --no-interactive
          
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew clean
            ./gradlew assembleRelease
          else
            echo "Ошибка: Папка android не была создана!"
            exit 1
          fi
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
    publishing:
      email:
        recipients:
          - capella2@ukr.net