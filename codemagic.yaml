workflows:
  android-workflow:
    name: Android Release APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Build Android APK
        script: |
          # Проверяем версию для отладки
          npx expo --version
          
          # Генерируем папку android БЕЗ флагов
          # В новых версиях Expo это самый стабильный способ
          npx expo prebuild --platform android
          
          # Проверяем результат и собираем
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleRelease
          else
            echo "Ошибка: Папка android не была создана!"
            # Выведем список файлов, чтобы понять, что произошло
            ls -R
            exit 1
          fi
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
    publishing:
      email:
        recipients:
          - capella2@ukr.net