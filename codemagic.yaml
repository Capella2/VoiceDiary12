# codemagic.yaml
workflows:
  android-workflow:
    name: Android Release APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
      groups:
        - google_play # Если есть ключи, иначе можно оставить пустым
    scripts:
      - name: Install dependencies
        script: |
          # Глубокая очистка и установка под React 19
          rm -rf node_modules
          npm install react@19.2.0 react-dom@19.2.0 @types/react@~19.2.0 --save-exact --legacy-peer-deps
          npm install --legacy-peer-deps
      - name: Build Android APK
        script: |
          # Очистка кэша Metro и временных файлов
          rm -rf $TMPDIR/metro-*
          mkdir -p assets/images
          
          # Предварительная сборка нативного проекта
          npx expo prebuild --platform android
          
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            
            # Увеличение памяти для предотвращения ошибок 'command node finished with non-zero exit value 1'
            export NODE_OPTIONS="--max-old-space-size=4096"
            
            ./gradlew clean
            # Сборка без проверки lint для успешного прохождения билда
            ./gradlew assembleRelease -x lint
          else
            echo "Ошибка: Папка android не была создана!"
            exit 1
          fi
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
    publishing:
      email:
        recipients:
          - capella2@ukr.net