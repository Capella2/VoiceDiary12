workflows:
  android-workflow:
    name: Android Release APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Build Android APK
        script: |
          # 1. Автоматический поиск и принятие лицензий
          yes | sdkmanager --licenses || true
          
          # 2. Очистка и генерация папки android
          # Мы добавили --force, чтобы если папка была создана с ошибкой, она пересоздалась
          npx expo prebuild --platform android --force
          
          # 3. Сборка самого APK
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
    publishing:
      email:
        recipients:
          - capella2@ukr.net